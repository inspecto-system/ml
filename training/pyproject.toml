[project]
name = "inspecto-ml"
version = "0.1.0"
description = "Inspecto ML track: dataset audit, training and evaluation of the defect category classifier"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "onnxscript>=0.7.2",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.13.7"

# PyTorch builds without CUDA (ADR-027: training on CPU); the official PyTorch index serves them.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# CODE_QUALITY.md §1–2: style, bugs, unused code (F401, F841), security (bandit rules S),
# complexity ≤ 10, arguments ≤ 5, annotations everywhere.
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "A", "C4", "C90", "SIM", "PT", "RET", "ARG",
    "PL", "PTH", "ERA", "ANN", "RUF", "T20", "BLE", "TRY",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5

[tool.ruff.lint.per-file-ignores]
# pytest checks are plain assert statements, and expected values are written inline in them.
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["inspecto_ml"]
branch = true

[tool.coverage.report]
fail_under = 80

# scikit-learn, torchvision and onnxruntime ship no type information (no py.typed, no stubs package).
[[tool.mypy.overrides]]
module = ["sklearn.*", "torchvision.*", "onnxruntime.*"]
ignore_missing_imports = true
